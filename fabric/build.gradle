plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // dev runtime only - everycomp's own accesswidener must apply on fabric for private field access
    modLocalRuntime("maven.modrinth:every-compat:$rootProject.everycomp_version-fabric") { transitive = false }
    modLocalRuntime("net.mehvahdjukaar:moonlight-fabric:$rootProject.moonlight_version") { transitive = false }
    modLocalRuntime("maven.modrinth:lets-do-furniture:$rootProject.furniture_version-fabric") { transitive = false }
    modLocalRuntime("maven.modrinth:lets-do-vinery:$rootProject.vinery_version-fabric") { transitive = false }
    modLocalRuntime("maven.modrinth:lets-do-beachparty:$rootProject.beachparty_version-fabric") { transitive = false }
    modLocalRuntime("maven.modrinth:lets-do-candlelight-farmcharm-compat:$rootProject.candlelight_version-fabric") { transitive = false }
    modLocalRuntime("maven.modrinth:lets-do-farm-charm:$rootProject.farmcharm_version-fabric") { transitive = false }
    modLocalRuntime("maven.modrinth:lets-do-meadow:$rootProject.meadow_version-fabric") { transitive = false }
    modLocalRuntime("maven.modrinth:lets-do-hearth-timber:$rootProject.hearth_and_timber_version-fabric") { transitive = false }
    // beachparty touches trinkets at startup; trinkets needs cardinal components
    modLocalRuntime("maven.modrinth:trinkets:$rootProject.trinkets_version-fabric") { transitive = false }
    modLocalRuntime("dev.onyxstudios.cardinal-components-api:cardinal-components-base:$rootProject.cardinal_components_version")
    modLocalRuntime("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:$rootProject.cardinal_components_version")
    modLocalRuntime("net.mehvahdjukaar:codecui-fabric:$rootProject.codecui_version") { transitive = false }
    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version")
    modLocalRuntime("maven.modrinth:emi:$rootProject.emi_fabric_version") { transitive = false }
    // BOP + deps give everycomp a modded wood source to generate into
    modLocalRuntime("maven.modrinth:biomes-o-plenty:$rootProject.bop_version-fabric") { transitive = false }
    modLocalRuntime("maven.modrinth:glitchcore:$rootProject.glitchcore_version-fabric") { transitive = false }
    modLocalRuntime("maven.modrinth:terrablender:$rootProject.terrablender_version-fabric") { transitive = false }
    modLocalRuntime("com.electronwill.night-config:core:$rootProject.nightconfig_version") { transitive = false }
    modLocalRuntime("com.electronwill.night-config:toml:$rootProject.nightconfig_version") { transitive = false }
    modLocalRuntime("net.jodah:typetools:$rootProject.typetools_version") { transitive = false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
