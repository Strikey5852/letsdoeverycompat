architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    compileOnly("net.mehvahdjukaar:everycomp-common:$rootProject.everycomp_version:common") { transitive = false }
    compileOnly("net.mehvahdjukaar:moonlight-common:$rootProject.moonlight_version") { transitive = false }

    compileOnly("maven.modrinth:lets-do-furniture:$rootProject.furniture_version-neoforge") { transitive = false }
    compileOnly("maven.modrinth:lets-do-vinery:$rootProject.vinery_version-neoforge") { transitive = false }
    compileOnly("maven.modrinth:lets-do-beachparty:$rootProject.beachparty_version-neoforge") { transitive = false }
    compileOnly("maven.modrinth:lets-do-candlelight-farmcharm-compat:$rootProject.candlelight_version-neoforge") { transitive = false }
    compileOnly("maven.modrinth:lets-do-farm-charm:$rootProject.farmcharm_version-neoforge") { transitive = false }
    compileOnly("maven.modrinth:lets-do-meadow:$rootProject.meadow_version-neoforge") { transitive = false }
    compileOnly("maven.modrinth:lets-do-hearth-timber:$rootProject.hearth_and_timber_version-neoforge") { transitive = false }
}